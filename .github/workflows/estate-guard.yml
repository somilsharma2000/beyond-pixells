# Estate guard — the $0 GitHub Actions version of changedetection.io
# (Free Stack Phase 1: protects the lead pipeline on all client gym sites).
#
# Daily at 07:30 IST (02:00 UTC): every client site must still serve 200 AND
# contain the three non-negotiable lead-pipeline markers:
#   1. gym-os-connect.js      (script that posts leads to Gym osssss)
#   2. data-gymos-lead form   (the lead form itself)
#   3. consent checkbox       (required consent capture — legal + platform rule)
# On any regression: opens/updates a GitHub issue. When everything passes again:
# closes the issue with a note. Also verifies the capture endpoint still
# answers (any HTTP code proves the function exists; 402 = known credit block).
#
# Full VPS-based changedetection.io (watches arbitrary markup diffs) is
# prepared in ops/vps/ and replaces this when the founder buys the VPS.

name: Estate Guard
on:
  schedule:
    - cron: "0 2 * * *" # 07:30 IST daily
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  GUARD_LABEL: estate-guard

jobs:
  guard:
    name: Client lead-pipeline guard
    runs-on: ubuntu-latest
    steps:
      - name: Check all client sites
        id: check
        run: |
          set +e
          declare -A SITES=(
            [Bettabodies]="https://somilsharma2000.github.io/bettabodies-system/"
            [Reds Gym]="https://somilsharma2000.github.io/reds-gym-system/"
            [Flex N Tone]="https://somilsharma2000.github.io/flex-n-tone-system/"
            [Fight Factory Manchester]="https://somilsharma2000.github.io/fight-factory-manchester-system/"
            [Oxigen Fitness Jaipur]="https://somilsharma2000.github.io/oxigen-fitness-digital/"
            [IronForge Bengaluru]="https://somilsharma2000.github.io/ironforge-website/"
            [Iron Forge Hyderabad]="https://somilsharma2000.github.io/iron-forge-website/"
            [PowerHouse Hyderabad]="https://somilsharma2000.github.io/powerhouse-fitness/"
          )
          FAILS=""
          for name in "${!SITES[@]}"; do
            url="${SITES[$name]}"
            body=$(curl -sL --max-time 20 -w '\n%{http_code}' "$url")
            status="${body##*$'\n'}"
            ok=1
            if [ "$status" != "200" ]; then
              FAILS+="- **$name** — HTTP $status (site down or moved)\n"; ok=0; continue
            fi
            printf '%s' "$body" | grep -q 'gym-os-connect.js' || { FAILS+="- **$name** — gym-os-connect.js missing (leads will NOT reach Gym OS)\n"; ok=0; }
            printf '%s' "$body" | grep -q 'data-gymos-lead' || { FAILS+="- **$name** — lead form (data-gymos-lead) missing\n"; ok=0; }
            printf '%s' "$body" | grep -q 'type="checkbox" required' || { FAILS+="- **$name** — consent checkbox missing (legal risk)\n"; ok=0; }
            [ $ok -eq 1 ] && echo "PASS  $name"
          done
          # capture endpoint: any response proves it exists; 402 is the known credit block
          cap=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X OPTIONS \
            "https://base44.app/api/apps/6a85aadd01bc42f293723858/functions/captureGymLead")
          case "$cap" in
            200|202|204|400|405|402|429) echo "PASS  captureGymLead endpoint answers (HTTP $cap)" ;;
            404|0|"") FAILS+="- **captureGymLead endpoint** — HTTP ${cap:-no response} (function missing — leads have nowhere to go)\n" ;;
            *) echo "WARN  captureGymLead endpoint HTTP $cap" ;;
          esac
          {
            echo "fails<<EOF"
            echo -e "$FAILS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$FAILS" ]; then echo "result=failing" >> "$GITHUB_OUTPUT"; else echo "result=passing" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update issue on regression
        if: steps.check.outputs.result == 'failing'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[guard] Client lead-pipeline regression";
            const fails = `${{ steps.check.outputs.fails }}`.trim();
            const body = `The daily estate guard found lead-pipeline regressions:\n\n${fails}\n\n_Auto-generated by the Estate Guard workflow. This issue auto-closes when all sites pass again._`;
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: [process.env.GUARD_LABEL], per_page: 10
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo, title, body, labels: [process.env.GUARD_LABEL]
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      - name: Close issue when passing
        if: steps.check.outputs.result == 'passing'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[guard] Client lead-pipeline regression";
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: [process.env.GUARD_LABEL], per_page: 10
            });
            for (const i of issues.data.filter(x => x.title === title)) {
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed" });
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number,
                body: "All client sites pass again — gym-os-connect.js, lead form, and consent checkbox verified on all 8 properties. Auto-closing." });
              core.info(`Closed issue #${i.number}`);
            }
