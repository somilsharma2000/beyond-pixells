# Smoke tests — $0 GitHub Actions version of browser-level QA (gap #9, §47)
# Renders flagship + client-template pages in a real headless browser and
# asserts: page loads, hero content visible, no JS console errors, lead form
# present where required. Fails the run and opens an issue on regression.
#
# This is the browser-render layer the estate lacked (curl-only checks before).

name: Smoke Tests
on:
  schedule:
    - cron: "0 3 * * *" # 08:30 IST daily, after the estate guard
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  SMOKE_LABEL: smoke-test

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Brand Hub", url: "https://somilsharma2000.github.io/beyond-pixells/", needs_form: false, hero: "Beyond Pixells" }
          - { name: "Gym OS Landing", url: "https://somilsharma2000.github.io/gym-os/", needs_form: false, hero: "Gym OS" }
          - { name: "Dentist OS Landing", url: "https://somilsharma2000.github.io/dentist-os-site/", needs_form: false, hero: "Dentist OS" }
          - { name: "Builder OS", url: "https://somilsharma2000.github.io/builder-os-site/", needs_form: false, hero: "Builder OS" }
    steps:
      - name: Render and assert
        id: smoke
        run: |
          npm i playwright @playwright/test --no-fund --no-audit >/dev/null 2>&1 || npm i playwright >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          cat > smoke.mjs << 'EOF'
          import { chromium } from "playwright";
          const [url, needsForm, hero] = [process.argv[2], process.argv[3] === "true", process.argv[4]];
          const errors = [];
          const browser = await chromium.launch();
          const page = await browser.newPage();
          page.on("console", m => { if (m.type() === "error") errors.push(m.text().slice(0, 200)); });
          page.on("pageerror", e => errors.push(String(e).slice(0, 200)));
          const fails = [];
          try {
            const res = await page.goto(url, { waitUntil: "networkidle", timeout: 30000 });
            if (!res || res.status() >= 400) fails.push(`HTTP ${res?.status}`);
            const body = (await page.textContent("body")) || "";
            if (hero && !body.toLowerCase().includes(hero.toLowerCase())) fails.push(`hero text "${hero}" not found`);
            if (needsForm) {
              const hasForm = await page.locator("form[data-gymos-lead], #trial-form").count();
              if (!hasForm) fails.push("lead form missing");
              const hasConsent = await page.locator("input[type=checkbox][required]").count();
              if (!hasConsent) fails.push("consent checkbox missing");
            }
            // hero section must actually paint (not a blank page)
            const visible = await page.locator("h1, h2").first().isVisible().catch(() => false);
            if (!visible) fails.push("no visible heading rendered");
            // scroll must work (guards against fixed-body scroll locks — the
            // 26 Sep gym-os incident) — wait out smooth scrolling before reading
            const scrollY = await page.evaluate(async () => {
              window.scrollTo(0, 1500);
              await new Promise(r => setTimeout(r, 800));
              return window.scrollY;
            });
            if (scrollY < 100) fails.push(`scroll locked (scrollY=${scrollY})`);
            // cursor-follow spotlight glow must stay removed estate-wide
            const spot = await page.evaluate(() => {
              const c = document.querySelector(".bp-spotlight-card");
              if (!c) return "none";
              const bg = getComputedStyle(c, "::before").backgroundImage;
              return bg && bg !== "none" && bg.includes("radial-gradient") ? "GLOW" : "clean";
            });
            if (spot === "GLOW") fails.push("cursor spotlight glow is back");
          } catch (e) { fails.push(`navigation: ${String(e).slice(0, 120)}`); }
          await browser.close();
          if (errors.length) fails.push(`console errors: ${errors.slice(0, 3).join(" | ")}`);
          if (fails.length) { console.error("FAIL " + fails.join("; ")); process.exit(1); }
          console.log("PASS");
          EOF
          set +e
          node smoke.mjs "${{ matrix.url }}" "${{ matrix.needs_form }}" "${{ matrix.hero }}" > result.txt 2>&1
          code=$?
          cat result.txt
          {
            echo "code=$code" >> "$GITHUB_OUTPUT"
            echo "msg<<EOF" >> "$GITHUB_OUTPUT"; cat result.txt >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          }
          exit 0

      - name: Fail the job if any assertion failed
        if: steps.smoke.outputs.code != '0'
        run: |
          echo "::error::${{ matrix.name }} smoke failed: ${{ steps.smoke.outputs.msg }}"
          exit 1

  issue:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ !cancelled() && needs.smoke.result == 'failure' }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "[smoke] Browser render regression";
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: [process.env.SMOKE_LABEL], per_page: 10
            });
            const body = `Daily browser smoke test failed. Details:
            ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            _Auto-generated by the Smoke Tests workflow. Closes when all pages pass again._`;
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [process.env.SMOKE_LABEL] });
            }
