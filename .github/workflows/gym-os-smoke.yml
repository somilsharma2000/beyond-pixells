# Gym OS functional smoke — daily health alert for the flagship app.
#
# Layer 1 of the alert stack for gym-os-v3.vercel.app:
#   - Upptime (beyond-pixells-status repo): availability, every 5 min, public page.
#   - THIS workflow: functional checks, daily 08:40 IST — logs in as the
#     documented demo owner, asserts the dashboard renders with clean data,
#     no junk markers, no JS errors, no mobile overflow. Catches "site up but
#     broken" states that a 200-OK ping cannot see.
# On failure: opens a GitHub issue (label gym-os-alert); auto-closes when a
# passing run follows (recovery job below).
#
# Credentials are the pre-seeded demo owner, documented in gym-os-v3
# docs/ADMIN_GUIDE.md — safe by design: the demo reset wipes demo tenants only.

name: Gym OS Functional Smoke
on:
  schedule:
    - cron: "10 3 * * *" # 08:40 IST daily
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  ALERT_LABEL: gym-os-alert

jobs:
  smoke:
    name: Login + dashboard render
    runs-on: ubuntu-latest
    steps:
      - name: Functional check
        id: fn
        run: |
          npm i playwright >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          cat > gymos-smoke.mjs << 'EOF'
          import { chromium } from 'playwright';
          const APP = 'https://gym-os-v3.vercel.app';
          const b = await chromium.launch({args:['--disable-gpu','--disable-dev-shm-usage']});
          const pg = await b.newPage({viewport:{width:390,height:844}});
          const errs = [];
          pg.on('pageerror', e => errs.push(e.message.slice(0,80)));
          let fails = [];
          const assert = (cond, msg) => { if (!cond) fails.push(msg); };

          await pg.goto(APP + '/login', {waitUntil:'networkidle', timeout:60000});
          assert(await pg.locator('input[type=email]').count() > 0, 'login page did not render');
          await pg.fill('input[type=email]', 'oxigen.owner@demo.gymos.local');
          await pg.fill('input[type=password]', 'Demo@1234');
          await pg.click('button[type=submit]');
          await pg.waitForTimeout(6000);

          const url = pg.url();
          assert(url.includes('/dashboard'), 'login did not reach dashboard (url: ' + url + ')');
          const body = await pg.textContent('body');
          for (const m of ['Dashboard','Members','Leads','Classes']) assert(body.includes(m), 'dashboard missing marker: ' + m);
          for (const junk of ['Test Lead','Conv Guest','Trial Guest']) assert(!body.includes(junk), 'demo junk marker visible: ' + junk);
          const sw = await pg.evaluate(() => document.documentElement.scrollWidth);
          assert(sw <= 392, 'mobile overflow at 390px: scrollWidth ' + sw);
          assert(errs.length === 0, 'JS errors: ' + errs.slice(0,2).join(' | '));

          console.log('FAILS:', fails.length ? fails.join(' ; ') : 'none');
          await b.close();
          process.exit(fails.length ? 1 : 0);
          EOF
          if node gymos-smoke.mjs; then code=0; else code=1; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fail if broken
        if: steps.fn.outputs.code != '0'
        run: exit 1

  alert:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ !cancelled() && needs.smoke.result == 'failure' }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "[gym-os] Flagship app functional check failed";
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: [process.env.ALERT_LABEL], per_page: 10
            });
            const body = `The daily Gym OS functional smoke failed (login, dashboard render, clean demo data, or mobile checks).
            Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            _Auto-generated by the Gym OS Functional Smoke workflow. The recovery job auto-closes this issue on the next passing run._`;
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [process.env.ALERT_LABEL] });
            }

  recovery:
    name: Close alert on pass
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ !cancelled() && needs.smoke.result == 'success' }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "[gym-os] Flagship app functional check failed";
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: [process.env.ALERT_LABEL], per_page: 20
            });
            for (const i of issues.data.filter(i => i.title === title)) {
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed" });
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: "Recovered — the latest functional run passed. Auto-closing." });
            }
