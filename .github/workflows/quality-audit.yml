# Estate quality audit — $0 GitHub Actions version of Lighthouse CI + pa11y
# (Free Stack Category 4: performance, accessibility, best-practices, SEO).
#
# Weekly (Mon 08:00 IST / Sun 23:30 UTC) + on-demand: audits the five flagship
# properties with Lighthouse (4 categories) and pa11y (WCAG on the hub).
# Fails the run and opens an issue when any Lighthouse category drops below
# the floor (perf 80, a11y 90, BP 85, SEO 85) — floors are floors, not goals.

name: Quality Audit
on:
  schedule:
    - cron: "30 23 * * 0" # 05:00 IST Monday
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  AUDIT_LABEL: quality-audit

jobs:
  lighthouse:
    name: Lighthouse — flagship properties
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Brand Hub", url: "https://somilsharma2000.github.io/beyond-pixells/" }
          - { name: "Gym OS Landing", url: "https://somilsharma2000.github.io/gym-os/" }
          - { name: "Dentist OS Landing", url: "https://somilsharma2000.github.io/dentist-os-site/" }
          - { name: "Builder OS", url: "https://somilsharma2000.github.io/builder-os-site/" }
          - { name: "Gym OS Platform", url: "https://my-gym-os.base44.app" }
    steps:
      - name: Run Lighthouse on ${{ matrix.name }}
        id: lh
        run: |
          set +e
          npx --yes lighthouse "${{ matrix.url }}" \
            --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output-path=report.json --quiet \
            --only-categories=performance,accessibility,best-practices,seo
          node -e '
            const r = require("./report.json");
            const cats = Object.fromEntries(Object.entries(r.categories).map(([k, v]) => [k, Math.round(v.score * 100)]));
            const floors = { performance: 80, accessibility: 90, "best-practices": 85, seo: 85 };
            let bad = [];
            for (const [k, floor] of Object.entries(floors)) {
              if (cats[k] < floor) bad.push(`${k}: ${cats[k]} (floor ${floor})`);
            }
            console.log(JSON.stringify(cats));
            require("fs").writeFileSync(process.env.GITHUB_OUTPUT,
              `scores=${JSON.stringify(cats)}\n` +
              (bad.length ? `bad=${bad.join(", ")}\n` : "") +
              "failed=" + (bad.length ? "true" : "false") + "\n",
              { flag: "a" });
          '
      - name: Report
        run: |
          echo "=== ${{ matrix.name }} — ${{ steps.lh.outputs.scores }}"
          [ "${{ steps.lh.outputs.failed }}" != "true" ] && echo "All categories above floors" || echo "BELOW FLOOR: ${{ steps.lh.outputs.bad }}"

  pa11y:
    name: Accessibility (pa11y) — flagships
    runs-on: ubuntu-latest
    steps:
      - name: Run pa11y on all flagship landings
        run: |
          npm i -g pa11y
          export PUPPETEER_EXECUTABLE_PATH=$(which chromium || which chromium-browser || which google-chrome)
          set +e
          out=""
          for u in beyond-pixells gym-os dentist-os-site builder-os-site; do
            echo "=== pa11y: $u ==="
            r=$(pa11y "https://somilsharma2000.github.io/$u/" --standard WCAG2AA --level error 2>&1) || out="$out $u FAILED;"
            echo "$r" | head -20
          done
          if [ -n "$out" ]; then
            {
              echo "out<<EOF"
              echo "$out" | head -100
              echo "EOF"
              echo "failed=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "pa11y: no WCAG2AA errors on any flagship"
          fi
        id: pa11y

  issue:
    name: Open issue on failures
    runs-on: ubuntu-latest
    needs: [lighthouse, pa11y]
    if: ${{ !cancelled() && (needs.lighthouse.result == 'failure' || needs.pa11y.outputs.failed == 'true') }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "[audit] Quality floors breached";
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: [process.env.AUDIT_LABEL], per_page: 10
            });
            const body = `Weekly quality audit found failures. See the run for details:
            ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            _Auto-generated by the Quality Audit workflow._`;
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [process.env.AUDIT_LABEL] });
            }
