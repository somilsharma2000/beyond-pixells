<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Stat Drop — 1080×1920 social template</title>
<!-- BEYOND PIXELLS SOCIAL TEMPLATE — "STAT DROP" (Format 1)
     Usage: open in browser at full size, screen-record 3-5s, export reel.
     Edit the 3 EDIT-ME lines below. Design: docs/DESIGN_LANGUAGE.md -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090C;width:1080px;height:1920px;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center}
.frame{width:1080px;height:1920px;display:flex;flex-direction:column;justify-content:center;padding:80px 72px;box-sizing:border-box;position:relative}
.frame::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 500px at 85% 8%,rgba(255,59,48,.18),transparent 70%),radial-gradient(500px 400px at 10% 95%,rgba(255,122,0,.1),transparent 70%)}
.kicker{font-size:30px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#FF7A00;margin-bottom:36px}
.num{font-family:'Space Grotesk';font-weight:700;font-size:360px;line-height:1;background:linear-gradient(135deg,#FF3B30 0%,#FF7A00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .7s cubic-bezier(.16,1,.3,1) both}
.num small{font-size:140px;color:#94A3B8;-webkit-text-fill-color:#94A3B8}
.claim{font-family:'Space Grotesk';font-weight:700;font-size:64px;line-height:1.18;color:#F8FAFC;margin-top:28px}
.claim span{background:linear-gradient(135deg,#FF3B30,#FF7A00);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:34px;color:#94A3B8;margin-top:30px;line-height:1.55;max-width:800px}
.footer{position:absolute;bottom:70px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.1);padding-top:36px}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:38px;color:#F8FAFC}
.brand b{background:linear-gradient(135deg,#FF3B30,#FF7A00);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:26px;color:#5C6479;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
@keyframes pop{0%{opacity:0;transform:scale(.8) translateY(40px)}100%{opacity:1;transform:none}}
</style></head>
<body><div class="frame">
  <!-- EDIT ME 1: the stat -->
  <div class="kicker">Gym OS · The Numbers</div>
  <div class="num">₹64,000</div>
  <!-- EDIT ME 2: the claim -->
  <div class="claim">the average annual fee leakage <span>we stop.</span></div>
  <!-- EDIT ME 3: the explanation -->
  <div class="sub">15–20 members train past expiry every month. Automated WhatsApp reminders collect before the awkward conversation starts.</div>
  <div class="footer"><div class="brand">Gym OS <b>·</b> by Beyond Pixells</div><div class="tag">gym-os.in</div></div>
</div></body></html>
