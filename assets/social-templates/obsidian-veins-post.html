<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Obsidian Veins — 1080×1920 social template</title>
<!-- BEYOND PIXELLS SOCIAL TEMPLATE v5 "OBSIDIAN VEINS" — self-contained, screenshot-ready.
     Same visual language as the live site: cracked black surface, glowing violet veins,
     glitter geode core, glossy droplets. Edit the marked lines only. -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#07070A;--violet-deep:#3B1470;--violet:#7C3AED;--violet-bright:#A855F7;--violet-glow:#C4B5FD;--sparkle:#F5F3FF}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);width:1080px;height:1920px;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;position:relative}
.grain{position:absolute;inset:0;z-index:1;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.veins{position:absolute;inset:0;z-index:1}
.veins .glow{fill:none;stroke:var(--violet-bright);stroke-linecap:round;filter:blur(9px);opacity:.55}
.veins .core{fill:none;stroke:var(--violet-glow);stroke-linecap:round;opacity:.92;stroke-dasharray:6 16;animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-220}}
.droplets i{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(230,220,255,.75),rgba(20,14,30,.9) 38%,rgba(4,3,7,.98) 72%);
  box-shadow:0 3px 10px rgba(0,0,0,.6),0 0 10px rgba(124,58,237,.25)}
.frame{position:relative;z-index:3;padding:110px 90px;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center}
.frame::after{content:"";position:absolute;inset:44px;border:1px solid rgba(196,181,253,.16);border-radius:28px;pointer-events:none;z-index:4}
.geode{position:absolute;top:150px;right:110px;width:230px;height:242px;z-index:5}
.geode .shard{position:absolute;inset:0;
  clip-path:polygon(48% 2%,72% 14%,88% 40%,84% 68%,62% 92%,36% 96%,12% 76%,8% 46%,20% 18%);
  background:radial-gradient(120% 120% at 30% 20%,#1a1424 0%,#0B0714 55%,#050308 100%);
  box-shadow:0 0 0 2px rgba(196,181,253,.55) inset,0 0 60px 10px rgba(124,58,237,.6),0 30px 70px rgba(0,0,0,.65)}
.geode .shard::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 45% 35%,rgba(196,181,253,.4),transparent 70%)}
.geode .sparkle{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(196,181,253,.9);animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.kicker{font-family:'Space Grotesk';font-weight:700;font-size:30px;letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(110deg,var(--violet-glow),var(--sparkle));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:26px;z-index:3;position:relative}
.hook{font-family:'Space Grotesk';font-weight:700;font-size:104px;line-height:1.08;color:#F5F3FF;letter-spacing:-.03em;z-index:3;position:relative}
.hook span{background:linear-gradient(135deg,var(--violet-bright) 0%,var(--violet-glow) 50%,var(--violet-bright) 100%);
  background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 4s ease-in-out infinite}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sub{font-size:40px;color:#9C93B5;margin-top:30px;line-height:1.4;max-width:820px;z-index:3;position:relative}
.footer{position:absolute;bottom:120px;left:90px;right:90px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:38px;color:#F5F3FF}
.brand b{background:linear-gradient(135deg,var(--violet-bright),var(--violet-glow));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:24px;color:#7C7391;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
</style></head>
<body>
<div class="grain"></div>
<svg class="veins" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
  <path class="glow" d="M-10 1750 C 160 1600, 120 1400, 320 1300 C 480 1220, 440 1050, 620 950 C 780 860, 720 650, 900 520 C 1000 450, 980 300, 1120 220" stroke-width="12"/>
  <path class="glow" d="M-30 300 C 140 380, 200 500, 380 480 C 520 465, 560 600, 620 950" stroke-width="10"/>
  <path class="core" d="M-10 1750 C 160 1600, 120 1400, 320 1300 C 480 1220, 440 1050, 620 950 C 780 860, 720 650, 900 520 C 1000 450, 980 300, 1120 220" stroke-width="2.6"/>
  <path class="core" d="M-30 300 C 140 380, 200 500, 380 480 C 520 465, 560 600, 620 950" stroke-width="2.2"/>
</svg>
<div class="droplets" id="dp"></div>
<div class="geode">
  <div class="shard"></div>
  <i class="sparkle" style="width:3px;height:3px;top:30%;left:40%;animation-delay:.2s"></i>
  <i class="sparkle" style="width:2px;height:2px;top:55%;left:60%;animation-delay:.9s"></i>
  <i class="sparkle" style="width:4px;height:4px;top:42%;left:52%;animation-delay:1.6s"></i>
  <i class="sparkle" style="width:2px;height:2px;top:65%;left:35%;animation-delay:2.1s"></i>
</div>
<div class="frame">
  <!-- EDIT ME -->
  <div class="kicker">Beyond Pixells · Gym OS</div>
  <div class="hook">Your gym's leads <span>stop leaking</span></div>
  <div class="sub">One system runs your members, check-ins and WhatsApp follow-ups — while you sleep.</div>
  <div class="footer"><div class="brand">Gym OS <b>·</b> by Beyond Pixells</div><div class="tag">Book a demo</div></div>
</div>
<script>
(function(){var d=document,h=d.getElementById('dp');
for(var i=0;i<16;i++){var s=4+Math.random()*15,el=d.createElement('i');
el.style.width=s+'px';el.style.height=s+'px';el.style.left=Math.random()*94+'%';el.style.top=Math.random()*94+'%';h.appendChild(el);}
})();
</script>
</body></html>
